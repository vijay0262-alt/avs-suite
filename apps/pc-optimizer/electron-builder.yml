appId: com.avs.pcoptimizer
productName: AVS AI Shield
copyright: Copyright © 2024 Advanced Vision Software LLC. All rights reserved.
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - build/**/*
  - package.json
extraResources:
  - from: ../../backend/dist/backend-py
    to: backend
    filter:
      - "**/*"
  - from: ./resources/clamav
    to: clamav
    filter:
      - "**/*"
  - from: ./build/icon.ico
    to: icon.ico
  - from: ./build/icon.png
    to: icon.png
  - from: ./build/tray-icon.png
    to: tray-icon.png
extraMetadata:
  main: dist-electron/main/index.js
  author:
    name: Advanced Vision Software LLC
    email: help@avsshield.com
  publisherName: Advanced Vision Software LLC
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
  publisherName: Advanced Vision Software LLC
  sign: null
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: false
  include: build/installer.nsh
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
