[project]
name = "avs-backend"
version = "0.1.0"
description = "AVS AI Shield — Python backend (JSON-RPC over stdio)"
requires-python = ">=3.12"
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
mypy_path = ["src"]
