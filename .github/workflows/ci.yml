name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-typecheck-test:
    name: Lint • Typecheck • Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

  backend:
    name: Backend (Python)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        run: python -m pip install -r backend/requirements.txt

      - name: Pytest
        working-directory: backend
        run: python -m pytest -q

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: [lint-typecheck-test, backend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Free disk space
        shell: pwsh
        run: |
          # Remove unnecessary tool caches and SDKs to reclaim ~10GB.
          Remove-Item -Recurse -Force "$env:LOCALAPPDATA\Temp\*" -ErrorAction SilentlyContinue
          if (Test-Path "C:\Program Files\dotnet\sdk") {
            Remove-Item -Recurse -Force "C:\Program Files\dotnet\sdk\*" -ErrorAction SilentlyContinue
          }
          if (Test-Path "C:\Program Files (x86)\Android") {
            Remove-Item -Recurse -Force "C:\Program Files (x86)\Android" -ErrorAction SilentlyContinue
          }

      - name: Install
        run: |
          yarn install --frozen-lockfile
          python -m pip install -r backend/requirements.txt

      - name: Package PC Optimizer
        run: yarn package:pc-optimizer

      - name: Clean intermediate build outputs
        shell: pwsh
        run: |
          # Remove win-unpacked (~300MB) and blockmap files — not needed as artifacts.
          Remove-Item -Recurse -Force "apps/pc-optimizer/release/win-unpacked" -ErrorAction SilentlyContinue
          Remove-Item -Force "apps/pc-optimizer/release/*.blockmap" -ErrorAction SilentlyContinue
          Remove-Item -Force "apps/pc-optimizer/release/builder-debug.yml" -ErrorAction SilentlyContinue
          Remove-Item -Force "apps/pc-optimizer/release/builder-effective-config.yaml" -ErrorAction SilentlyContinue

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: pc-optimizer-installer
          path: |
            apps/pc-optimizer/release/*.exe
            apps/pc-optimizer/release/latest.yml
          retention-days: 5
          if-no-files-found: error
